<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar — pre-token protocols worth farming</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">

  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <h1>Token Radar</h1>
      <span class="brand-name" id="model-tag">comps-1</span>
    </div>
    <div class="top-meta" id="top-meta">
      <span id="as-of"></span>
      <span id="headline"></span>
    </div>
  </header>

  <section id="stats" class="strip" aria-label="Board headline numbers"></section>

  <section id="risers" class="strip risers" aria-label="Fastest risers this week"></section>

  <nav id="tabs" class="tabs" aria-label="Views"></nav>

  <div id="howto" class="howto"></div>

  <section id="filters" class="filters" aria-label="Board filters"></section>

  <section class="board-wrap" aria-label="Ranked board">
    <table class="board">
      <thead>
        <tr>
          <th data-key="rank" class="th-sort num">Rank</th>
          <th data-key="name" class="th-sort">Protocol</th>
          <th data-key="category" class="th-sort">Category</th>
          <th data-key="tvl_usd" class="th-sort num">TVL</th>
          <th data-key="change_7d" class="th-sort num">7d</th>
          <th data-key="implied_value_usd" class="th-sort num">Implied value</th>
          <th data-key="airdrop_value_usd" class="th-sort num">Airdrop 7%</th>
          <th data-key="listed_at" class="th-sort">From</th>
          <th data-key="risk" class="th-sort">Risk</th>
        </tr>
      </thead>
      <tbody id="board-body"></tbody>
    </table>
    <p id="honest" class="honest"></p>
  </section>

  <section id="detail" class="detail" aria-label="Protocol detail"></section>

  <section id="method" class="method" aria-label="Methodology"></section>

  <section id="live" class="live" aria-label="Live-token protocols"></section>

</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
